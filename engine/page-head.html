<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 6px 0 4px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 680px;
    aspect-ratio: 1024 / 1536;
    margin: 0 auto;
  }
  .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 6px;
  }
  .hotspot {
    position: absolute;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .hotspot:active { transform: scale(0.97); }

  .btn-prev {
    border-radius: 50px;
    font-size: clamp(13px, 2.1vw, 16px);
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(2px);
  }
  .btn-prev:hover { background: rgba(255,255,255,0.22); }

  .btn-next, .btn-restart {
    border-radius: 50px;
    font-size: clamp(13px, 2.1vw, 16px);
    background: linear-gradient(135deg, #d35400, #f0955a);
    color: #fff;
    box-shadow: 0 6px 18px rgba(211, 84, 0, 0.45);
  }
  .btn-next:hover, .btn-restart:hover { box-shadow: 0 8px 22px rgba(211, 84, 0, 0.6); }

  /* Barre de navigation sous l'image (hors illustration, jamais de superposition) */
  .navbar{display:flex;gap:12px;width:100%;max-width:680px;margin:8px auto 0;padding:0 14px;}
  .navbar .hotspot{position:static;width:auto;height:38px;flex:1;font-size:14px;}
  .navbar .btn-prev{flex:0 0 auto;min-width:110px;}
</style>
<!-- PWA Mini-guide -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{SHORT}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
